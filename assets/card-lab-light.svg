<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="BrightLoop Lab, a lab that builds itself: Every night, agents pick ideas from the queue, build them, playtest them in a real browser and ship only what passes, with live smoke tests and automatic rollback.">
<style>
  .label { font: 600 12px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #0B7A59; letter-spacing: 1.8px; }
  .title { font: 800 36px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #0F1720; letter-spacing: -.8px; }
  .desc  { font: 400 15.5px Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #56616E; }
  .chip  { font: 500 12px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #0F1720; }
  .node  { font: 600 12px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #0F1720; letter-spacing: 1.2px; }
  .time  { font: 600 13px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #56616E; letter-spacing: 1px; }
</style>
<defs>
  <pattern id="ldots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#E2E6DF"/></pattern>
  <radialGradient id="lglow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#0B7A59" stop-opacity=".22"/><stop offset="1" stop-color="#0B7A59" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="lframe"><rect width="1000" height="270" rx="16"/></clipPath>
</defs>
<g clip-path="url(#lframe)">
  <rect width="1000" height="270" fill="#FFFFFF"/>
  <rect x="560" width="440" height="270" fill="url(#ldots)"/>
  <circle cx="790" cy="135" r="170" fill="url(#lglow)"/>
  <rect x="0" y="26" width="3" height="46" rx="1.5" fill="#0B7A59"/>
  <text x="48" y="48" class="label">BRIGHTLOOP LAB · LIVE</text>
  <text x="46" y="94" class="title">A lab that builds itself</text>
  <text x="48" y="132" class="desc">Every night, agents pick ideas from the queue, build them,</text><text x="48" y="155" class="desc">playtest them in a real browser and ship only what passes,</text><text x="48" y="178" class="desc">with live smoke tests and automatic rollback.</text>
  <rect x="48" y="206" width="66" height="26" rx="13" fill="#FAFAF7" stroke="#DFE3DC"/><text x="81" y="223.5" text-anchor="middle" class="chip">Agents</text><rect x="121.8" y="206" width="95" height="26" rx="13" fill="#FAFAF7" stroke="#DFE3DC"/><text x="169" y="223.5" text-anchor="middle" class="chip">Playwright</text><rect x="224.8" y="206" width="95" height="26" rx="13" fill="#FAFAF7" stroke="#DFE3DC"/><text x="272" y="223.5" text-anchor="middle" class="chip">Cloudflare</text><rect x="327.8" y="206" width="102" height="26" rx="13" fill="#FAFAF7" stroke="#DFE3DC"/><text x="379" y="223.5" text-anchor="middle" class="chip">Rust + WASM</text>
  <circle cx="790" cy="135" r="92" fill="none" stroke="#DFE3DC" stroke-width="2"/>
  <circle cx="790" cy="135" r="92" fill="none" stroke="#0B7A59" stroke-width="2" stroke-dasharray="2 10" opacity=".55"/>
  <circle r="7" fill="#A9620C"><animateMotion dur="9s" repeatCount="indefinite" path="M 790 43 a 92 92 0 1 1 0 184 a 92 92 0 1 1 0 -184"/></circle>
  <rect x="756.5" y="29.0" width="67.0" height="28" rx="14" fill="#FFFFFF" stroke="#0B7A59" stroke-width="1.5"/><text x="790.0" y="47.5" text-anchor="middle" class="node">IDEAS</text><rect x="848.5" y="121.0" width="67.0" height="28" rx="14" fill="#FFFFFF" stroke="#0B7A59" stroke-width="1.5"/><text x="882.0" y="139.5" text-anchor="middle" class="node">BUILD</text><rect x="744.2" y="213.0" width="91.6" height="28" rx="14" fill="#FFFFFF" stroke="#0B7A59" stroke-width="1.5"/><text x="790.0" y="231.5" text-anchor="middle" class="node">PLAYTEST</text><rect x="668.6" y="121.0" width="58.8" height="28" rx="14" fill="#FFFFFF" stroke="#0B7A59" stroke-width="1.5"/><text x="698.0" y="139.5" text-anchor="middle" class="node">SHIP</text>
  <g transform="translate(779 109)" fill="#A9620C"><path d="M14 2a10 10 0 1 0 8 15A8 8 0 0 1 14 2z"/></g>
  <text x="790" y="157" text-anchor="middle" class="time">NIGHTLY</text>
  <g transform="translate(950 22)" stroke="#56616E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 L18 6 M9 6 H18 V15"/></g>
</g>
<rect x=".75" y=".75" width="998.5" height="268.5" rx="15.25" fill="none" stroke="#DFE3DC" stroke-width="1.5"/>
</svg>