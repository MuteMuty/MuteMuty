name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0B7A59&color_dots=#ebedf0,#b6e8d3,#7cd4b0,#2fa57f,#0B7A59
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F5B971&color_dots=#161b22,#1d4a3d,#2f7d64,#52b892,#7CF2C4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
